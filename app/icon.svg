<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Reading Club">
  <!-- Brand favicon: the "RC" monogram from the site header (R solid, C
       outlined, Anton display face) on the brutalist signal-yellow tile with
       a thick square black frame. The letters are the real Anton glyph
       outlines baked to paths so the icon renders without a font dependency
       (favicons can't load web fonts). If you change this, mirror it in
       scripts/gen-icon.mjs (the apple-touch-icon uses the same artwork). -->
