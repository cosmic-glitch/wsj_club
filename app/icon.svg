<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WSJ Reading Club">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" />
      <stop offset="0.5" stop-color="#f43f5e" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)" />
  <!-- open book: two cream pages; the gutter reveals the gradient as a colorful spine -->
  <path d="M15.3 9.6 L6 8 L6 22 L15.3 23.4 Z" fill="#faf8f4" />
  <path d="M16.7 9.6 L26 8 L26 22 L16.7 23.4 Z" fill="#faf8f4" />
  <!-- lines of text, following each page's tilt -->
  <g stroke="#cbd5e1" stroke-width="0.9" stroke-linecap="round">
    <line x1="8.4" y1="12.2" x2="13.6" y2="12.9" />
    <line x1="8.4" y1="15.2" x2="13.6" y2="15.9" />
    <line x1="8.4" y1="18.2" x2="13.6" y2="18.9" />
    <line x1="18.4" y1="12.9" x2="23.6" y2="12.2" />
    <line x1="18.4" y1="15.9" x2="23.6" y2="15.2" />
    <line x1="18.4" y1="18.9" x2="23.6" y2="18.2" />
  </g>
  <!-- bookmark ribbon -->
  <path d="M20 7.6 L22.4 7.6 L22.4 15 L21.2 13.2 L20 15 Z" fill="#10b981" />
</svg>
