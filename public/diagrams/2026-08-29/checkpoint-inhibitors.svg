<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 350" role="img" aria-label="A T cell stopped by a stand-down signal, then reaching the tumour once a drug blocks that signal">
  <style>
    text { font-family: ui-monospace, Menlo, Consolas, monospace; fill: #0a0a0a; }
    .hd { font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    .name { font-size: 12.5px; letter-spacing: .04em; font-weight: 700; }
    .note { font-size: 11px; fill: #555; }
    .tl { font-size: 17px; font-weight: 700; }
    .box { fill: #fff; stroke: #0a0a0a; stroke-width: 3; }
    .arrow { stroke: #0a0a0a; stroke-width: 3; fill: none; }
    .dead { stroke: #0a0a0a; stroke-width: 3; fill: none; opacity: .35; }
    .flag { fill: #ffe600; stroke: #0a0a0a; stroke-width: 3; }
  </style>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a0a0a"/>
    </marker>
  </defs>
  <rect width="460" height="350" fill="#fff"/>

  <!-- PANEL A — the brake is on -->
  <text class="hd" x="16" y="22">WITHOUT THE DRUG</text>
  <circle class="box" cx="54" cy="88" r="26"/>
  <text class="tl" x="54" y="95" text-anchor="middle">T</text>
  <text class="note" x="54" y="132" text-anchor="middle">T CELL</text>

  <line class="dead" x1="86" y1="88" x2="176" y2="88"/>
  <g stroke="#0a0a0a" stroke-width="5" stroke-linecap="round">
    <line x1="176" y1="76" x2="200" y2="100"/>
    <line x1="200" y1="76" x2="176" y2="100"/>
  </g>

  <rect class="flag" x="214" y="68" width="40" height="40"/>
  <text class="note" x="234" y="132" text-anchor="middle">STAND DOWN</text>

  <rect class="box" x="264" y="52" width="180" height="72"/>
  <text class="name" x="354" y="86" text-anchor="middle">TUMOUR CELL</text>
  <text class="note" x="354" y="104" text-anchor="middle">displays the signal</text>

  <text class="note" x="16" y="160">The tumour switches off the T cell before it can attack.</text>

  <line x1="0" y1="178" x2="460" y2="178" stroke="#d6d3d1" stroke-width="2"/>

  <!-- PANEL B — the brake is jammed -->
  <text class="hd" x="16" y="206">WITH A CHECKPOINT INHIBITOR</text>
  <circle class="box" cx="54" cy="272" r="26"/>
  <text class="tl" x="54" y="279" text-anchor="middle">T</text>
  <text class="note" x="54" y="316" text-anchor="middle">T CELL</text>

  <rect class="flag" x="214" y="252" width="40" height="40"/>
  <rect x="202" y="244" width="16" height="56" fill="#0a0a0a"/>
  <text class="note" x="210" y="316" text-anchor="middle">DRUG</text>

  <rect class="box" x="264" y="236" width="180" height="72"/>
  <text class="name" x="354" y="278" text-anchor="middle">TUMOUR CELL</text>

  <!-- drawn last so the unbroken attack reads over the disabled signal -->
  <line class="arrow" x1="86" y1="272" x2="262" y2="272" marker-end="url(#ah2)"/>

  <text class="note" x="16" y="344">Signal blocked. The attack the vaccine aimed goes ahead.</text>
</svg>
