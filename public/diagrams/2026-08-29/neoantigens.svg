<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" role="img" aria-label="Three cells inspected by a T cell">
  <style>
    text { font-family: ui-monospace, Menlo, Consolas, monospace; fill: #0a0a0a; }
    .name { font-size: 12.5px; letter-spacing: .04em; font-weight: 700; }
    .verdict { font-size: 11.5px; letter-spacing: .03em; font-weight: 700; }
    .note { font-size: 11px; fill: #555; }
    .tl { font-size: 15px; font-weight: 700; }
    .box { fill: #fff; stroke: #0a0a0a; stroke-width: 3; }
    .frag { fill: #0a0a0a; }
    .odd { fill: #ffe600; stroke: #0a0a0a; stroke-width: 2.5; }
    .arrow { stroke: #0a0a0a; stroke-width: 3; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a0a0a"/>
    </marker>
  </defs>
  <rect width="460" height="400" fill="#fff"/>

  <!-- ROW 1 — healthy cell -->
  <g>
    <rect class="box" x="16" y="44" width="152" height="58"/>
    <path class="frag" d="M30 44 L46 44 L38 28 z"/>
    <path class="frag" d="M56 44 L72 44 L64 28 z"/>
    <path class="frag" d="M82 44 L98 44 L90 28 z"/>
    <path class="frag" d="M108 44 L124 44 L116 28 z"/>
    <path class="frag" d="M134 44 L150 44 L142 28 z"/>
    <text class="name" x="92" y="78" text-anchor="middle">HEALTHY CELL</text>
    <line class="arrow" x1="178" y1="73" x2="222" y2="73" marker-end="url(#ah)"/>
    <circle class="box" cx="250" cy="73" r="19"/>
    <text class="tl" x="250" y="79" text-anchor="middle">T</text>
    <text class="verdict" x="280" y="69">ALL FRAGMENTS SELF</text>
    <text class="verdict" x="280" y="86">T CELL WALKS PAST</text>
  </g>

  <!-- ROW 2 — virus-infected cell -->
  <g>
    <rect class="box" x="16" y="164" width="152" height="58"/>
    <path class="frag" d="M30 164 L46 164 L38 148 z"/>
    <path class="frag" d="M56 164 L72 164 L64 148 z"/>
    <path class="odd" d="M82 164 L98 164 L90 146 z"/>
    <path class="frag" d="M108 164 L124 164 L116 148 z"/>
    <path class="frag" d="M134 164 L150 164 L142 148 z"/>
    <text class="name" x="92" y="198" text-anchor="middle">INFECTED CELL</text>
    <line class="arrow" x1="178" y1="193" x2="222" y2="193" marker-end="url(#ah)"/>
    <circle class="box" cx="250" cy="193" r="19"/>
    <text class="tl" x="250" y="199" text-anchor="middle">T</text>
    <text class="verdict" x="280" y="189">A VIRUS FRAGMENT</text>
    <text class="verdict" x="280" y="206">T CELL DESTROYS IT</text>
  </g>

  <!-- ROW 3 — tumour cell -->
  <g>
    <rect class="box" x="16" y="284" width="152" height="58"/>
    <path class="frag" d="M30 284 L46 284 L38 268 z"/>
    <path class="frag" d="M56 284 L72 284 L64 268 z"/>
    <path class="frag" d="M82 284 L98 284 L90 268 z"/>
    <path class="odd" d="M108 284 L124 284 L116 266 z"/>
    <path class="frag" d="M134 284 L150 284 L142 268 z"/>
    <text class="name" x="92" y="318" text-anchor="middle">TUMOUR CELL</text>
    <line class="arrow" x1="178" y1="313" x2="222" y2="313" marker-end="url(#ah)"/>
    <circle class="box" cx="250" cy="313" r="19"/>
    <text class="tl" x="250" y="319" text-anchor="middle">T</text>
    <text class="verdict" x="280" y="309">ONE MUTATED PROTEIN</text>
    <text class="verdict" x="280" y="326">THE NEOANTIGEN</text>
  </g>

  <text class="note" x="16" y="368">Yellow = a fragment the body has never built before.</text>
  <text class="note" x="16" y="386">Everything else on the tumour is ordinary self.</text>
</svg>
