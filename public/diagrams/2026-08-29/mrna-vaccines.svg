<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 456" role="img" aria-label="Pipeline from comparing tumour and healthy DNA to a cell building and displaying the protein">
  <style>
    text { font-family: ui-monospace, Menlo, Consolas, monospace; fill: #0a0a0a; }
    .name { font-size: 12.5px; letter-spacing: .04em; font-weight: 700; }
    .note { font-size: 11px; fill: #555; }
    .seq { font-size: 14px; letter-spacing: .22em; font-weight: 700; }
    .box { fill: #fff; stroke: #0a0a0a; stroke-width: 3; }
    .arrow { stroke: #0a0a0a; stroke-width: 3; fill: none; }
    .frag { fill: #0a0a0a; }
    .odd { fill: #ffe600; stroke: #0a0a0a; stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a0a0a"/>
    </marker>
  </defs>
  <rect width="460" height="456" fill="#fff"/>

  <!-- 1. the two DNA samples -->
  <rect class="box" x="16" y="12" width="190" height="46"/>
  <text class="name" x="111" y="41" text-anchor="middle">TUMOUR DNA</text>
  <rect class="box" x="254" y="12" width="190" height="46"/>
  <text class="name" x="349" y="41" text-anchor="middle">HEALTHY DNA</text>

  <path class="arrow" d="M111 58 L111 76 L230 76 L230 92" marker-end="url(#ah3)"/>
  <path class="arrow" d="M349 58 L349 76 L230 76" />

  <!-- 2. compare -->
  <rect class="box" x="70" y="96" width="320" height="56"/>
  <text class="name" x="230" y="121" text-anchor="middle">COMPARE THEM</text>
  <text class="note" x="230" y="139" text-anchor="middle">every place they differ is a mutation</text>

  <line class="arrow" x1="230" y1="152" x2="230" y2="180" marker-end="url(#ah3)"/>

  <!-- 3. the sequence -->
  <rect class="box" x="70" y="184" width="320" height="66"/>
  <text class="note" x="230" y="205" text-anchor="middle">the personalised part is now just text</text>
  <rect x="216" y="216" width="18" height="22" fill="#ffe600"/>
  <text class="seq" x="230" y="234" text-anchor="middle">A C G T A C</text>

  <line class="arrow" x1="230" y1="250" x2="230" y2="278" marker-end="url(#ah3)"/>

  <!-- 4. the shot -->
  <rect class="box" x="70" y="282" width="320" height="56" rx="28"/>
  <text class="name" x="230" y="307" text-anchor="middle">mRNA VACCINE</text>
  <text class="note" x="230" y="325" text-anchor="middle">those letters, wrapped in a ball of fat</text>

  <line class="arrow" x1="230" y1="338" x2="230" y2="366" marker-end="url(#ah3)"/>

  <!-- 5. back to the cell from the first diagram -->
  <rect class="box" x="130" y="386" width="200" height="42"/>
  <path class="frag" d="M148 386 L164 386 L156 370 z"/>
  <path class="frag" d="M178 386 L194 386 L186 370 z"/>
  <path class="odd" d="M208 386 L224 386 L216 368 z"/>
  <path class="frag" d="M238 386 L254 386 L246 370 z"/>
  <path class="frag" d="M268 386 L284 386 L276 370 z"/>
  <text class="name" x="230" y="413" text-anchor="middle">YOUR OWN CELL</text>
  <text class="note" x="230" y="446" text-anchor="middle">builds the protein and holds it up</text>
</svg>
